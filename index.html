<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Qwitcher+Grypen:wght@400;700&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(ellipse 700px 500px at 15% -5%, #e2d2ac30, transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 105%, #e2d2ac40, transparent 60%),
        #ece1cf;
      min-height: 100vh;
    }
    a { color: #7a1d1d; }
    a:hover, a:focus-visible { color: #5c1414; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</helmet>

<div style="display: flex; align-items: center; justify-content: center; padding: 36px 20px; min-height: 100vh; font-family: 'Montserrat',sans-serif; color: #5c1414; position: relative">
  <div style="width:100%;max-width:460px;position:relative;">
    
    

    <div style="border:1px solid #cdb999;background:#f4ecdd;box-shadow:0 24px 48px -20px rgba(90,40,20,0.28);padding:46px 34px 40px;text-align:center;animation:rise 0.7s ease-out both;">
      <div style="width:108px;height:108px;margin:0 auto 18px;border-radius:50%;overflow:hidden;border:1px solid #cdb999;background:#ece1cf;padding:8px;">
        
      <img src="./d-logo-06-msg5gj9m-jnuk.png" alt="Diclan logo" style="width: 100%; height: 100%; object-fit: fill; border-radius: 50%; display: block"></div>

      

      

      <div style="width:60px;height:1px;background:#7a1d1d;margin:18px auto 18px;opacity:0.55;"></div>

      <div style="display:flex;flex-direction:column;gap:14px;">
        <a href="./DICLAN-MENU-OUT.pdf" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;text-decoration:none;color:#5c1414;border:1px solid #cdb999;background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.15));transition:border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;" style-hover="border-color:#7a1d1d;background:rgba(122,29,29,0.06);transform:translateX(2px);">
          <span style="text-align:left;">
            <span style="display: block; font-family: 'Qwitcher Grypen',cursive; font-weight: 400; font-size: 32px; color: #7a1d1d; line-height: 1; -webkit-text-stroke: 1px #7a1d1d">Takeout Menu</span>
            <span style="display:block;font-size:10.5px;font-weight:400;letter-spacing:0.14em;text-transform:uppercase;color:#8a7457;margin-top:5px;">View full menu</span>
          </span>
          <span style="font-size:18px;color:#7a1d1d;flex-shrink:0;">→</span>
        </a><a href="./DICLAN-MENU-IN.pdf" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;text-decoration:none;color:#5c1414;border:1px solid #cdb999;background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.15));transition:border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;" style-hover="border-color:#7a1d1d;background:rgba(122,29,29,0.06);transform:translateX(2px);">
          <span style="text-align:left;">
            <span style="display: block; font-family: 'Qwitcher Grypen',cursive; font-weight: 400; font-size: 32px; color: #7a1d1d; line-height: 1; -webkit-text-stroke: 1px #7a1d1d">Dine-In Menu</span>
            <span style="display:block;font-size:10.5px;font-weight:400;letter-spacing:0.14em;text-transform:uppercase;color:#8a7457;margin-top:5px;">View full menu</span>
          </span>
          <span style="font-size:18px;color:#7a1d1d;flex-shrink:0;">→</span>
        </a>

        

        <a href="DICLAN-MENU-COCKTAIL.pdf" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;text-decoration:none;color:#5c1414;border:1px solid #cdb999;background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.15));transition:border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;" style-hover="border-color:#7a1d1d;background:rgba(122,29,29,0.06);transform:translateX(2px);">
          <span style="text-align:left;">

          </span>
          <span style="font-size:18px;color:#7a1d1d;flex-shrink:0;">→</span>
        </a>
      </div>

      <footer style="margin-top:36px;font-size:10px;font-weight:300;letter-spacing:0.24em;text-transform:uppercase;color:#8a7457;opacity:0.75;">Diclan Restaurant</footer>
